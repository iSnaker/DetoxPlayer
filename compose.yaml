name: detoxplayer
x-runtime: &runtime
  image: detoxplayer-server
  init: true
  restart: unless-stopped
  environment:
    DATA_DIR: /data
    SOURCE_ROOTS: /sources/music
  volumes:
    - library-data:/data
    - type: bind
      source: ${MUSIC_PATH:-F:/Music}
      target: /sources/music
      read_only: true
      bind:
        create_host_path: false
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 40s
services:
  server:
    <<: *runtime
    build:
      context: ./server
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
  api:
    <<: *runtime
    command: [uvicorn, app.client:create_app, --factory, --host, 0.0.0.0, --port, '8080', --no-proxy-headers, --no-access-log, --timeout-graceful-shutdown, '30']
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    depends_on:
      server:
        condition: service_healthy
volumes:
  library-data:
