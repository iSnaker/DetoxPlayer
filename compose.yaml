name: detoxplayer
services:
  server:
    build:
      context: ./server
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      SOURCE_ROOTS: /sources/music
    volumes:
      - library-data:/data
      - type: bind
        source: ${MUSIC_PATH:-F:/Music}
        target: /sources/music
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
volumes:
  library-data:
